<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- ✅ Vueport correct pour la responsivité -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- 🔒 En-têtes de sécurité Client/Navigateur -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ✅ Balises SEO améliorées -->
    <title>BCUY1 – Bibliothèque Centrale Universitaire de Yaoundé I</title>
    <meta name="description" content="Catalogue documentaire, thèses et mémoires, ressources électroniques, dépôt institutionnel et services de la Bibliothèque Centrale de l'Université de Yaoundé I (BCUY1)." />
    <meta name="keywords" content="BCUY1, bibliothèque, université Yaoundé 1, UY1, catalogue, thèses, mémoires, OPAC, PMB, ressources électroniques, documentation, bibliothèque universitaire Cameroun" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://bcu-uyi.cm/" />
    
    <!-- ✅ Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bcu-uyi.cm/" />
    <meta property="og:title" content="BCUY1 – Bibliothèque Centrale Universitaire" />
    <meta property="og:description" content="Accédez au catalogue, aux thèses numérisées et aux ressources électroniques de l'UY1." />
    <meta property="og:image" content="https://bcu-uyi.cm/logo.png" />
    <meta property="og:image:alt" content="Logo BCU UYI" />
    <meta property="og:site_name" content="BCU UYI" />
    <meta property="og:locale" content="fr_CM" />
    
    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bcu-uyi.cm/" />
    <meta name="twitter:title" content="BCUY1 – Bibliothèque Centrale Universitaire" />
    <meta name="twitter:description" content="Accédez au catalogue, aux thèses numérisées et aux ressources électroniques de l'UY1." />
    <meta name="twitter:image" content="https://bcu-uyi.cm/logo.png" />

    <!-- ✅ Google Fonts (Inter + Source Serif 4) : les polices les plus performantes pour le web) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    
    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- ✅ Données structurées JSON-LD (Organisation) pour le SEO enrichi -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Bibliothèque Centrale Universitaire de Yaoundé I",
        "alternateName": "BCUY1",
        "url": "https://bcu-uyi.cm",
        "logo": "https://bcu-uyi.cm/logo.png",
        "description": "La Bibliothèque Centrale de l'Université de Yaoundé I est la principale structure documentaire de l'UY1.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Yaoundé",
          "addressCountry": "CM"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
