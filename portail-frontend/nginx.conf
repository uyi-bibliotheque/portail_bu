server {
    listen 80;
    server_name  10.4.2.112 localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ═══════════════════════════════════════════════════════════════════
    # ─── UPLOAD DE FICHIERS (CRITIQUE POUR L'ADMIN) ──────────────────
    # ═══════════════════════════════════════════════════════════════════
    # Limite à 100 Mo par fichier uploadé (images, PDFs, mémoires, etc.)
    client_max_body_size 100M;
    client_body_buffer_size 256k;
    client_body_timeout 300s;
    client_header_timeout 300s;
    large_client_header_buffers 4 16k;
    send_timeout 300s;

    # Compression Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Routes Frontend (React SPA Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ═══════════════════════════════════════════════════════════════════
    # ─── PROXY API BACKEND DJANGO ────────────────────────────────────
    # ═══════════════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts augmentés pour les uploads longs (mémoires PDF, images)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        # IMPORTANT : taille max du body pour les uploads
        client_max_body_size 100M;

        # Désactiver le buffering pour les gros uploads
        proxy_request_buffering off;
    }

    # ═══════════════════════════════════════════════════════════════════
    # ─── PROXY ADMIN DJANGO ──────────────────────────────────────────
    # ═══════════════════════════════════════════════════════════════════
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
        proxy_request_buffering off;
    }

    # ═══════════════════════════════════════════════════════════════════
    # ─── FICHIERS STATIQUES DJANGO (Admin, DRF) ──────────────────────
    # ═══════════════════════════════════════════════════════════════════
    location /django_static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ═══════════════════════════════════════════════════════════════════
    # ─── FICHIERS MÉDIAS DJANGO (PDFs, Photos, etc.) ─────────────────
    # ═══════════════════════════════════════════════════════════════════
    location /media/ {
    alias /app/media/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
}

    # ═══════════════════════════════════════════════════════════════════
    # ─── ASSETS STATIQUES DU BUILD REACT ─────────────────────────────
    # ═══════════════════════════════════════════════════════════════════
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ═══════════════════════════════════════════════════════════════════
    # ─── GESTION DES ERREURS ─────────────────────────────────────────
    # ═══════════════════════════════════════════════════════════════════
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Erreur 413 personnalisée (fichier trop gros)
    error_page 413 /413.html;
    location = /413.html {
        root /usr/share/nginx/html;
    }
}
